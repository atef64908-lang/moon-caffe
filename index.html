<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Cafe</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
overflow:hidden;
}

/* فيديو الخلفية */
#bg-video{
position:fixed;
right:0;
bottom:0;
min-width:100%;
min-height:100%;
object-fit:cover;
z-index:-1;
}

/* طبقة شفافة */
.overlay{
width:100%;
height:100vh;
background:rgba(0,0,0,0.45);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

/* اسم الكافيه */
#title{
font-size:75px;
color:white;
letter-spacing:4px;
text-shadow:0 0 20px #d4a373;
animation:moveTitle 2s infinite alternate;
margin-bottom:20px;
}

/* رسالة الترحيب */
#welcome{
color:#fff;
font-size:28px;
margin-bottom:25px;
text-shadow:0 0 10px black;
}

/* حركة الاسم */
@keyframes moveTitle{
from{transform:translateY(0);}
to{transform:translateY(-15px);}
}

/* زرار الدخول */
.btn{
text-decoration:none;
padding:18px 45px;
font-size:22px;
color:white;
background:#8B4513;
border-radius:50px;
animation:glow 1.5s infinite alternate;
transition:0.4s;
}

/* لمعة الزر */
@keyframes glow{
from{box-shadow:0 0 10px white;}
to{box-shadow:0 0 30px #ffcc70;}
}

.btn:hover{
transform:scale(1.1);
background:#a0522d;
}
</style>
</head>

<body>

<!-- فيديو الخلفية -->
<video autoplay muted loop id="bg-video">
    <source src="videos/cafe.mp4" type="video/mp4">
</video>

<!-- المحتوى -->
<div class="overlay">

    <h1 id="title">Moon Cafe</h1>

    <h2 id="welcome"></h2>

    <a href="home.html" class="btn">
        Enter Now
    </a>

</div>

<script>

// جلب الاسم من صفحة اللوجن
let name = localStorage.getItem("name");

if(name){
document.getElementById("welcome").innerText = "Hello " + name + " ☕ Welcome Back!";
}else{
document.getElementById("welcome").innerText = "Welcome To Moon Cafe ☕";
}

</script>

</body>
</html>
